<style id="css">
/* VOICE: field instrument — sober, exact, fast with one thumb on a plant walk-down.
   IDEA: the company's inspection sheet itself: each item is one row of the report, filled on site.
   PICTURE: the working form and item register; a frame elevation with defect markers on the home screen.
   COLOUR and TYPE: graphite band, white sheet, signal orange accent; risk and GUT use the report's own red/amber/yellow/green. Archivo.
   LAYOUT: one calm column up to 860px; sticky tabs; full-screen sheet per item with camera first. */
:root{color-scheme:light dark;--bg:#fff;--pan:#f3f4f6;--ink:#14181c;--mut:#59616b;--line:#dde0e5;--band:#1d2329;--acc:#ff5a1f}
@supports (color:light-dark(#000,#fff)){:root{--bg:light-dark(#fff,#111417);--pan:light-dark(#f3f4f6,#1a1e23);--ink:light-dark(#14181c,#eceef1);--mut:light-dark(#59616b,#9ca4ae);--line:light-dark(#dde0e5,#2d333a)}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button,label,.chip,[data-open]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{background:var(--band);color:#fff;padding:12px max(4vw,14px);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;min-height:68px}
header h1{font-size:19px;font-stretch:80%;font-weight:800;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{font-size:13px;color:#c3cad2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.ib{background:none;border:0;color:#fff;min-width:44px;min-height:44px;font-size:22px;cursor:pointer;border-radius:8px}
.wrap{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 90px}
h2{font-size:clamp(28px,6vw,38px);line-height:1.05;margin:6px 0 12px;text-wrap:balance}
h3{font-size:17px;margin:26px 0 10px;font-stretch:85%;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--pan);cursor:pointer;font-weight:600;text-align:center}
.btn svg{flex:none}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:#c81e1e}.btn.sm{min-height:38px;padding:0 12px;font-size:14px}.btn[disabled]{opacity:.5;cursor:default}
.up{position:relative;overflow:hidden}.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.up:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}.sp{flex:1}
.hero{background:var(--pan);border-radius:14px;padding:16px;margin:4px 0 18px}.hero svg{width:100%;height:140px;display:block}
.card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;margin:10px 0;cursor:pointer}
.card .cb{display:flex;flex-direction:column;gap:3px}.card b{font-size:17px}
.cth,.th{border-radius:8px;background:var(--pan) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.cth{width:72px;height:72px}.th{width:64px;height:64px}
.bd{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;line-height:20px}
.bd.pe{background:var(--line);color:var(--ink)}
.bds{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tabs{display:flex;gap:4px;position:sticky;top:68px;background:var(--bg);z-index:4;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs button{flex:1;min-height:44px;border:0;background:none;border-radius:8px;font-weight:600;font-size:14px;padding:0 2px;white-space:nowrap;overflow:hidden;color:var(--mut);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--pan);color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}
.ct{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--ink);font-size:12px;line-height:19px;vertical-align:1px}
fieldset{border:0;padding:0;margin:0 0 6px}legend{font-size:17px;font-weight:700;font-stretch:85%;padding:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}.f.w{grid-column:1/-1}
.f>span{font-size:13px;color:var(--mut);font-weight:600}.f small{font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;min-height:44px;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{min-height:92px;resize:vertical}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.acts .pri{flex:1 1 220px}
.seg2{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 4px;width:max-content;max-width:100%}

.an{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg);width:100%;text-align:left;cursor:pointer}
.an b{display:block}.an small{color:var(--mut);display:block;font-size:13px}.an small.loc{color:var(--ink);font-weight:600;display:flex;gap:4px;align-items:flex-start}.an small.loc svg{flex:none;margin-top:2px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;overscroll-behavior:contain}.sheet.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px}

.tile input{min-height:38px;font-size:14px;padding:6px 9px}
.cap{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}.cap .btn{flex:1 1 140px}
.sec{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}

.seg{display:flex;gap:4px}.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:grid;place-items:center;min-height:44px;border:1px solid var(--line);border-radius:8px;font-weight:700;cursor:pointer;text-align:center;font-size:15px;line-height:1.15;padding:2px}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--acc)}
.gut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.rb{background:var(--pan);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}

.help{background:var(--pan);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.help p{margin:6px 0}.help b{font-weight:700}
details.help summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.cr{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.cr h4{margin:10px 0 2px;font-size:14px}
.cr button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;min-height:40px}
.cr button b{min-width:42px;text-align:center;border-radius:6px;background:var(--line);padding:2px 6px}
.cr button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cr button[disabled]{opacity:.55;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:4px 12px;min-height:34px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.auth{max-width:440px;margin:0 auto}.ahero{text-align:center;margin:8px 0 14px}.ahero svg{max-width:300px;width:100%;height:auto}.ahero p{margin:6px 0 0}
.aform{display:grid;gap:12px;margin:14px 0 8px}.aok{color:#1b5e20;background:#2e7d3214;border-radius:10px;padding:10px 12px;margin:4px 0 0;font-size:14px}.lnk{margin-top:4px}.aform .btn{justify-content:center;min-height:48px}.aerr{color:var(--err,#b3261e);background:#b3261e14;border-radius:10px;padding:10px 12px;margin:4px 0 0;font-size:14px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}.wn{display:flex;gap:8px;align-items:center;flex:1 1 180px;min-width:0}.wn b{display:block}.wn small{color:var(--mut);display:block;font-size:13px}.wn svg{flex:none}
.who .ct,.btn .ct{margin-left:6px}
.ilink{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}.ilink span{display:block;font-size:14px;margin-top:4px}
.urow{border:1px solid var(--line,#d8dce1);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:grid;gap:8px}.urow .ui b{display:block}.urow .ui small{color:var(--mut);font-size:13px}.urow .row{gap:6px}.pwf input{flex:1 1 160px;min-height:40px}
.inst{background:var(--pan);border-left:4px solid var(--acc);border-radius:12px;padding:12px 14px;margin:4px 0 16px}.inst p{margin:6px 0 10px;font-size:14px}
.empty{text-align:center;padding:28px 12px;border:2px dashed var(--line);border-radius:14px}
.note{font-size:13px;color:var(--mut);margin:8px 0}
.xl{border:1px solid var(--line);border-radius:14px;padding:4px 16px 14px;margin:8px 0 6px}
.chk{list-style:none;padding:0;margin:6px 0 12px}
.chk li{padding:4px 0 4px 24px;position:relative;font-size:15px}
.chk li::before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:50%;background:#e0a100}
.chk.ok li::before{background:#5fae2e}
.capa{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;align-items:start}
.capa .im{max-width:360px;aspect-ratio:4/3;border-radius:10px;background:var(--pan) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.bars{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 32px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;min-width:2px}.bar span:last-child{text-align:right;font-weight:700}
.cam{position:fixed;inset:0;background:#000;z-index:40;display:flex}.cam[hidden]{display:none}
.cam video{width:100%;height:100%;object-fit:contain;background:#000}
.camf{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px max(4vw,14px);background:linear-gradient(#000b,#0000);color:#fff}
.camn{flex:1;font-weight:700;font-size:15px}.camtop .btn{background:#fff;color:#111;border-color:#fff}
.cambot{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px max(6vw,18px) max(28px,env(safe-area-inset-bottom));background:linear-gradient(#0000,#000b)}
.shut{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#ffffff40;cursor:pointer;justify-self:center}.shut:active{transform:scale(.93);background:#fff9}
.tor{justify-self:start;width:52px;height:52px;border-radius:50%;border:0;background:#ffffff26;color:#fff;display:grid;place-items:center;cursor:pointer}.tor[aria-pressed=true]{background:#ffd54a;color:#111}
.camth{justify-self:end;width:56px;height:56px;border-radius:10px;border:2px solid #fff;background:#333 center/cover no-repeat}
@media(max-width:600px){.grid,.gut{grid-template-columns:minmax(0,1fr)}.capa{grid-template-columns:minmax(0,1fr)}.res{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.sheet.on{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

function updSt(net){if(net!==undefined)netDown=!!net;if(MODE==='local'){st('Salvo neste aparelho');return}if(AU.st!=='in'){st('');return}
  const n=dirty.size,off=netDown||navigator.onLine===false;st(n?(off?`Sem conexão — ${n} pendente${n>1?'s':''}`:'Sincronizando…'):lastErr||(off?'Sem conexão — tudo salvo no aparelho':synced0?'Sincronizado':'Sincronizando…'))}
function saveLS(){const a=[...docs.values()];try{localStorage.setItem(LSK,JSON.stringify(a))}catch(e){try{localStorage.setItem(LSK,JSON.stringify(a.map(o=>o.kind==='anom'?{...o,fotos:o.fotos.map(f=>({...f,t:''}))}:o)))}catch(e2){}}}
function saveMeta(){IDB.put('meta','sync',{dirty:[...dirty]})}

function persist(o){o.updated=Date.now();if(ME&&MODE!=='local'){const w={uid:ME.uid,nome:ME.nome};if(!o.cri)o.cri=w;o.alt=w}docs.set(o.id,o);IDB.put('docs',o.id,o);if(!idbOK)saveLS();mark(o.id,'d');later(800)}
function rmDoc(id){docs.delete(id);IDB.del('docs',id);if(!idbOK)saveLS();mark(id,'x');later(500)}
async function flush(){
  if(flushing||!syncOn||!B){updSt();return}
  flushing=true;lastErr='';let net=false,stop=null;
  const ent=[...dirty],fo=ent.filter(([,e])=>e.op==='f'||e.op==='xf'),dc=ent.filter(([,e])=>e.op==='d'||e.op==='x');
  const done=(id,e)=>{const c=dirty.get(id);if(c&&c.v===e.v)dirty.delete(id)};
  const rec=([id,e])=>{const o=docs.get(id);return e.op==='d'&&o?{id,kind:o.kind,j:JSON.stringify(o),updated:o.updated||Date.now(),del:false}:{id,kind:'',j:'',updated:Date.now(),del:true}};
  try{
    for(const [id,e] of fo){   /* fotos primeiro: quando o item chega no outro aparelho, as fotos já estão no banco */
      try{if(e.op==='f'){const f=await fLocal(id);if(f)await B.putFoto(id,{data:f.data,w:f.w||0,h:f.h||0})}else await B.delFoto(id)}
      catch(err){if(err.code!=='too-big')throw err;lastErr='Uma foto ficou grande demais para o banco'}
      done(id,e);updSt()}
    for(let k=0;k<dc.length;k+=20){const ch=dc.slice(k,k+20);
      try{await B.push(ch.map(rec))}catch(err){if(err.code!=='too-big')throw err;for(const x of ch){try{await B.push([rec(x)])}catch(e2){if(e2.code!=='too-big')throw e2;lastErr='Um item ficou grande demais para o banco'}}}
      ch.forEach(([id,e])=>done(id,e));saveMeta()}
  }catch(err){if(err.code==='denied'||err.code==='auth')stop=err;else{if(err.code==='quota')lastErr=ERRM.quota;net=true}}
  flushing=false;saveMeta();
  if(stop){accessLost(stop);return}
  if(dirty.size){clearTimeout(ft);ft=setTimeout(flush,net?20000:400)}
  updSt(net)}

addEventListener('offline',()=>updSt());

    if(r.del){if(l){docs.delete(r.id);IDB.del('docs',r.id);(l.kind==='anom'?l.fotos:l.kind==='insp'?l.gerais:[]).forEach(f=>{fmem.delete(f.id);IDB.del('fotos',f.id)});ch=true}continue}
    let o=null;try{o=norm(Object.assign(JSON.parse(r.j),{id:r.id}))}catch(e){}
    if(o&&(!l||o.updated>l.updated)){docs.set(o.id,o);IDB.put('docs',o.id,o);ch=true}}

let pulling=false,pullAgain=false;

      if(!cache){netDown=false;synced0=true;lastPull=Date.now()}else if(!L.length)netDown=navigator.onLine===false;updSt()},
    e=>{unsub=null;if(e.code==='denied'||e.code==='auth'){accessLost(e);return}netDown=true;updSt();clearTimeout(lisT);lisT=setTimeout(attach,15000)})}

const loadImg=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});

async function takePhotos(files,max){const out=[];for(const f of files.slice(0,Math.max(0,max))){try{const r=await shrink(f),id=nid();putPhoto(id,{data:r.data,w:r.w,h:r.h});out.push({id,w:r.w,h:r.h,t:r.t,leg:'',ts:Date.now()})}catch(e){st('Não foi possível ler uma das imagens')}}return out}

function norm(o){
  if(!o||typeof o!=='object'||!okId(o.id))return null;
  o.created=+o.created||0;o.updated=+o.updated||0;
  if(o.kind==='insp'){if(!o.d||typeof o.d!=='object'||Array.isArray(o.d))o.d={};const d=o.d;for(const k of Object.keys(d))if(typeof d[k]!=='string')d[k]=String(d[k]??'');
    if(!o.v3){if(!d.tag&&d.nome)d.tag=d.nome;if(!d.rt&&(d.resp||d.reg||d.art))d.rt=[d.resp,d.reg&&'CREA/CAU '+d.reg,d.art&&'ART '+d.art].filter(Boolean).join(' · ');if(!d.info&&(d.end||d.cidade))d.info=[d.end,d.cidade].filter(Boolean).join(' — ');o.v3=1}
    o.gerais=(Array.isArray(o.gerais)?o.gerais:(o.capa?[o.capa]:[])).map(normF).filter(Boolean).slice(0,MAXG);delete o.capa;return o}
  if(o.kind==='anom'){
    if(!o.v3){if(o.recom&&!o.acao)o.acao=o.recom;const lc=[o.local,o.ident].filter(Boolean).join(' — ');if(lc&&!o.loc)o.loc=lc;
      o.elem=MIG.elem[o.elem]||'';o.orig=MIG.orig[o.cls]||'';o.manif=MIG.manif[o.manif]||'';if(o.elem||o.manif)o.mat='Concreto';o.v3=1}
    for(const k of STR)o[k]=typeof o[k]==='string'?o[k]:String(o[k]??'');
    for(const k of ['cd','g','u','t']){const n=parseInt(o[k],10);o[k]=n>=0&&n<=5?n:''}
    const q=parseFloat(String(o.qtd??'').replace(',','.'));o.qtd=isFinite(q)?q:'';
    let mig=false;
    o.fotos=(Array.isArray(o.fotos)?o.fotos:[]).map(f=>{if(typeof f==='string'){if(!okImg(f))return null;mig=true;const id=nid();putPhoto(id,{data:f,w:0,h:0});return{id,w:0,h:0,t:'',leg:'',ts:0}}return normF(f)}).filter(Boolean);
    if(mig)setTimeout(()=>{if(docs.get(o.id)===o)persist(o)},0);
    return o}
  return null}

function sumOf(i){const A=anoms(i.id),Sc=A.map(a=>score(a,i.d)),c=CFG.calc,pmax=Math.max(0,...Sc.map(s=>s.pont||0)),gmax=Math.max(0,...Sc.map(s=>s.gut||0)),td=today(),pz=Sc.map(s=>s.prazo).filter(Boolean).sort();
  return{A,Sc,pmax,gmax,nivel:pmax?lvl(c.risk,pmax):'',prio:gmax?lvl(c.gutp,gmax):'',byR:c.risk.map(r=>[r[1],Sc.filter(s=>s.nivel===r[1]).length]),byG:c.gutp.map(r=>[r[1],Sc.filter(s=>s.prio===r[1]).length]),venc:pz.filter(p=>p<td).length,next:pz.find(p=>p>=td)||''}}
function pend(i){const d=i.d,A=anoms(i.id),p=[],H=CFG.hdrLab,Sc=A.map(a=>score(a,d));
  ['unid','rt','os','data','tipo','tag','crit'].forEach(k=>{if(!String(d[k]||'').trim())p.push(H[k])});
  const ne=A.filter(a=>!a.elem).length,nm=A.filter(a=>!a.manif).length,pc=A.filter((a,k)=>a.manif&&!SPECIAL(a.manif)&&(Sc[k].pont===null||Sc[k].gut===null)).length,sf=A.filter(a=>!a.fotos.length&&!SPECIAL(a.manif)).length,cap=CFG.last-CFG.first+1;
  if(!i.gerais.length)p.push('Sem foto geral do ativo');
  if(!A.length)p.push('Nenhum item registrado');
  if(ne)p.push(`${pl(ne,'item','itens')} sem elemento/sistema (fica${ne>1?'m':''} sem numeração na planilha)`);
  if(nm)p.push(`${pl(nm,'item','itens')} sem manifestação patológica`);
  if(pc)p.push(`${pl(pc,'item','itens')} com risco ou GUT pendente`);
  if(sf)p.push(`${pl(sf,'item','itens')} sem foto`);
  if(A.length>cap)p.push(`O modelo comporta ${cap} itens; ${A.length-cap} ficarão de fora da planilha`);
  return p}

  if(kind==='capa'){const got=await takePhotos(files,MAXG-i.gerais.length);if(got.length){i.gerais.push(...got);persist(i);if(S.view==='edit'&&S.tab==='dados'&&S.cur===i.id&&!S.ed)tDados(i)}}
  else{if(kind==='nova'&&!S.ed)openA(newAnom(i.id));if(S.ed){const got=await takePhotos(files,MAXF-S.ed.fotos.length);S.ed.fotos.push(...got);S.newF.push(...got.map(f=>f.id));saveDraft(true);drawSheet()}}
  if(idbOK)IDB.del('meta','pend');updSt()}
$('#imp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text()),a=Array.isArray(j)?j:j&&Array.isArray(j.docs)?j.docs:null;if(!a)throw 0;let n=0,nf=0;
    if(j.fotos&&typeof j.fotos==='object')for(const [id,x] of Object.entries(j.fotos))if(okId(id)&&x&&okImg(x.data)){putPhoto(id,{data:x.data,w:+x.w||0,h:+x.h||0});nf++}
    a.forEach(o=>{const x=norm(o);if(x){persist(x);n++}});st(`${n} itens e ${nf} fotos restaurados`);render()}catch(err){st('Arquivo inválido')}});

/* ---------- início ---------- */
let tplBusy=true,restored=false;
async function localTpl(){const t=await IDB.get('meta','tplUser');tplBusy=false;if(!t||!t.parts)return;try{TPL=t;CFG=parseCfg(t)}catch(e){CFG=null;tplErr='O modelo tem um layout diferente do esperado ('+e.message+').'}}
const ready=(async()=>{
  idbOK=await IDB.ok();
  let a=idbOK?await IDB.all('docs'):[];
  if(!a.length){try{a=JSON.parse(localStorage.getItem(LSK)||'[]')}catch(e){a=[]}if(!Array.isArray(a))a=[];if(idbOK)a.forEach(o=>o&&okId(o.id)&&IDB.put('docs',o.id,o))}
  a.forEach(o=>{const x=norm(o);if(x){const l=docs.get(x.id);if(!l||x.updated>l.updated)docs.set(x.id,x)}});
  const m=idbOK&&await IDB.get('meta','sync');if(m){(m.dirty||[]).forEach(([k,v])=>{if(!dirty.has(k))dirty.set(k,v)});seq=Math.max(seq,...[...dirty.values()].map(v=>+v.v||0),0)}
})();
async function restoreUI(){
  if(restored||!CFG||!idbOK||S.ed){navOK=true;if(!S.ed)render();updSt();return}
  restored=true;
  {const fresh=t=>t&&Date.now()-t<12*36e5,nav=await IDB.get('meta','nav'),dr=await IDB.get('meta','draft');
    if(nav&&fresh(nav.ts)&&nav.view==='edit'&&docs.has(nav.cur)){S.view='edit';S.cur=nav.cur;S.tab=['dados','itens','rel'].includes(nav.tab)?nav.tab:'itens'}
    const de=dr&&fresh(dr.ts)&&docs.has(dr.cur)&&norm(dr.ed);
    const pd=await IDB.get('meta','pend'),pok=pd&&fresh(pd.ts)&&docs.has(pd.cur)&&Array.isArray(pd.files)&&pd.files.length;navOK=true;
    if(pok){S.view='edit';S.cur=pd.cur;S.tab=pd.kind==='capa'?'dados':'itens'}
    render();updSt();
    if(de&&de.kind==='anom'&&(!pok||de.insp===pd.cur||pd.kind==='capa')){if(S.cur!==dr.cur){S.view='edit';S.cur=dr.cur;S.tab='itens';render()}openA(de);S.newF=(dr.newF||[]).filter(okId);S.rmF=(dr.rmF||[]).filter(okId);saveDraft(true);st('Item em edição recuperado')}
    if(pok){await addFiles(pd.kind==='capa'?'capa':(S.ed?'anom':'nova'),pd.files,true);st(pl(pd.files.length,'foto recuperada','fotos recuperadas'))}else if(pd)IDB.del('meta','pend');
    return}
  navOK=true;if(!S.ed)render();updSt()}
render();
(async()=>{
  dlKnown=true;dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download=filename;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:'saved'}}};
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.isSecureContext&&document.querySelector('link[rel=manifest]')){const had=!!navigator.serviceWorker.controller;let upd=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||upd)return;upd=true;const go=()=>{if(S.ed||CAM.on||flushing){setTimeout(go,5000);return}location.reload()};go()});
    navigator.serviceWorker.register('sw.js').catch(()=>{})}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  await ready;
  if(MODE==='local'){await localTpl();await restoreUI();if(S.ed)drawSheet();else render();return}
  await boot()})();
}
</script>
